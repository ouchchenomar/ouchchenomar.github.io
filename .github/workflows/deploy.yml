# Construit le site avec Vite et le publie sur GitHub Pages à chaque push sur main.
# Prérequis : Settings > Pages > Source = « GitHub Actions ».
name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        # BASE_PATH vaut "/" pour un dépôt <compte>.github.io, "/<dépôt>/" sinon.
        run: npx tsc --noEmit && npx vite build --base="${BASE_PATH}"
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
